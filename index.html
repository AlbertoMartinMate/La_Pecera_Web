<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Pecera Pádel Club</title>
  </head>
  <body>

    <nav class="nav">
      <div class="nav__inner">
        <a class="nav__logo" href="#"></a>
        <ul class="nav__links"></ul>
        <button class="nav__cta"></button>
        <button class="nav__burger" aria-label="Abrir menú"></button>
      </div>
    </nav>

    <section id="hero" class="hero">
      <div class="hero__inner">
        <h1 class="hero__title"></h1>
        <p class="hero__subtitle"></p>
        <a class="hero__cta" href="#"></a>
      </div>
    </section>

    <div class="strip">
      <ul class="strip__list"></ul>
    </div>

    <div class="two-col">
      <div class="two-col__media"></div>
      <div class="two-col__content"></div>
    </div>

    <section id="features" class="features">
      <div class="features__inner">
        <h2 class="features__title"></h2>
        <div class="features__grid"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__brand"></div>
        <nav class="footer__nav" aria-label="Footer"></nav>
        <p class="footer__copy"></p>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
